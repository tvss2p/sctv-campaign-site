<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>キャンペーン確認サイト｜社内用</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;--accent:#4f8ef7;--accent2:#f7934f;--green:#3ecf8e;--red:#f75f5f;--yellow:#f7d94f;--text:#e8eaf6;--text-muted:#8b90b0;--radius:14px;--orange:#f7934f;--orange-dim:rgba(247,147,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
header{background:linear-gradient(135deg,#1e1a12,#12152b);padding:20px 16px 16px;border-bottom:2px solid var(--orange);position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;gap:10px}
.header-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--orange),#e8752a);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 2px 8px rgba(247,147,79,.4)}
header h1{font-size:16px;font-weight:700;line-height:1.3}
header p{font-size:10px;color:var(--text-muted);margin-top:2px}
.tab-nav{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;background:var(--bg);border-bottom:1px solid var(--border)}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;font-family:inherit;border:1.5px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;transition:all .2s}
.tab-btn.active{background:linear-gradient(135deg,var(--orange),#e8752a);border-color:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(247,147,79,.35)}
main{padding:16px}
.section-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--orange);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--orange),transparent)}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.card-header{padding:14px 16px 12px;cursor:pointer;display:flex;align-items:flex-start;gap:12px}
.card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;margin-top:1px}
.card-title-wrap{flex:1;min-width:0}
.card-category{font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:4px;display:inline-block;margin-bottom:5px}
.cat-limited{background:rgba(79,142,247,.18);color:var(--accent)}
.cat-always{background:rgba(62,207,142,.18);color:var(--green)}
.cat-trial{background:rgba(247,147,79,.18);color:var(--accent2)}
.cat-closed{background:rgba(247,95,95,.18);color:var(--red)}
.card-title{font-size:15px;font-weight:700;line-height:1.35}
.card-subtitle{font-size:11px;color:var(--text-muted);margin-top:3px}
.card-chevron{font-size:16px;color:var(--text-muted);transition:transform .25s;flex-shrink:0;margin-top:10px}
.card.open .card-chevron{transform:rotate(180deg)}
.period-bar{margin:0 16px 12px;background:var(--surface2);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px}
.period-bar .label{color:var(--text-muted);font-size:10px;white-space:nowrap}
.period-bar .value{font-weight:700;color:var(--orange)}
.card-body{display:none;padding:0 16px 16px}
.card.open .card-body{display:block}
.highlight{background:var(--surface2);border-left:3px solid var(--orange);border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:12px;font-size:13px;font-weight:700;line-height:1.5}
.price-old{font-size:11px;color:var(--text-muted);text-decoration:line-through;font-weight:400}
.price-new{font-size:18px;color:var(--green)}
.info-section{margin-bottom:14px}
.info-section-title{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.08em;margin-bottom:6px}
.info-row{display:flex;gap:8px;margin-bottom:6px;font-size:12px;line-height:1.5}
.info-row .dot{color:var(--accent);flex-shrink:0;margin-top:1px}
.info-row.warning .dot{color:var(--red)}
.info-row.ok .dot{color:var(--green)}
.combo-title{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.08em;margin-bottom:8px}
.combo-grid{display:grid;gap:5px}
.combo-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:8px;padding:7px 10px;font-size:12px}
.combo-name{color:var(--text);flex:1}
.combo-badge{font-size:11px;font-weight:700;padding:2px 10px;border-radius:12px;flex-shrink:0}
.combo-ok{background:rgba(62,207,142,.18);color:var(--green)}
.combo-ng{background:rgba(247,95,95,.18);color:var(--red)}
.combo-na{background:rgba(139,144,176,.15);color:var(--text-muted)}
.aipo-link{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(79,142,247,.15),rgba(79,142,247,.05));border:1px solid rgba(79,142,247,.3);border-radius:10px;padding:11px 14px;text-decoration:none;color:var(--accent);font-size:13px;font-weight:700;margin-top:14px}
.aipo-link .link-icon{font-size:16px}
.aipo-link .link-text{flex:1}
.aipo-link .link-arrow{font-size:14px;opacity:.7}
.kojihi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kojihi-box{background:var(--surface2);border-radius:10px;padding:10px 12px;text-align:center}
.kojihi-box .kj-label{font-size:9px;color:var(--text-muted);margin-bottom:4px}
.kojihi-box .kj-title{font-size:12px;font-weight:700;margin-bottom:6px}
.kojihi-box .kj-price{font-size:20px;font-weight:900;color:var(--green);line-height:1}
.kojihi-box .kj-sub{font-size:10px;color:var(--text-muted);margin-top:3px}
.matrix-wrap{overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
.matrix-hint{font-size:10px;color:var(--text-muted);margin-bottom:6px}
table.matrix{border-collapse:collapse;font-size:11px;width:max-content}
table.matrix th,table.matrix td{border:1px solid var(--border);padding:7px 6px;text-align:center;white-space:nowrap}
table.matrix th{background:var(--surface2);font-weight:700;font-size:10px;color:var(--text-muted)}
table.matrix th:first-child{text-align:left;min-width:130px}
table.matrix td:first-child{text-align:left;font-weight:600;font-size:11px;background:var(--surface2)}
.m-ok{color:var(--green);font-weight:700}
.m-ng{color:var(--red);font-weight:700}
.m-na{color:var(--text-muted)}
.aipo-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
#lock-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px}
.lock-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 24px;width:100%;max-width:320px;text-align:center}
.lock-icon{font-size:48px;margin-bottom:16px;display:block}
.lock-title{font-size:18px;font-weight:700;margin-bottom:6px}
.lock-sub{font-size:12px;color:var(--text-muted);margin-bottom:24px}
.lock-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:14px;font-size:24px;font-weight:700;color:var(--text);text-align:center;font-family:inherit;letter-spacing:8px;outline:none;transition:border-color .2s}
.lock-input:focus{border-color:var(--orange)}
.lock-btn{width:100%;margin-top:14px;padding:14px;background:linear-gradient(135deg,var(--orange),#e8752a);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 2px 10px rgba(247,147,79,.4)}
.lock-error{font-size:12px;color:var(--red);margin-top:10px;min-height:18px}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <span class="lock-icon">🔒</span>
    <div class="lock-title">社内専用サイト</div>
    <div class="lock-sub">アクセスコードを入力してください</div>
    <input class="lock-input" id="pw-input" type="password" maxlength="10" placeholder="----" onkeydown="if(event.key==='Enter')checkPw()">
    <button class="lock-btn" onclick="checkPw()">ログイン</button>
    <div class="lock-error" id="pw-error"></div>
  </div>
</div>

<div id="site-body" style="display:none">
<header>
  <div class="header-inner">
    <div class="header-icon">📋</div>
    <div><h1>キャンペーン確認サイト</h1><p>社内スタッフ向け｜2026年度版</p></div>
  </div>
</header>
<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('all',this)">すべて</button>
  <button class="tab-btn" onclick="switchTab('limited',this)">期間限定</button>
  <button class="tab-btn" onclick="switchTab('always',this)">常設</button>
  <button class="tab-btn" onclick="switchTab('trial',this)">試験施策</button>
  <button class="tab-btn" onclick="switchTab('matrix',this)">重畳適用表</button>
</div>
<main id="main"></main>
</div>

var DATA=null;

async function checkPw(){
  var pw=document.getElementById('pw-input').value;
  var btn=document.querySelector('.lock-btn');
  var err=document.getElementById('pw-error');
  if(!pw)return;
  btn.textContent='認証中...';
  btn.disabled=true;
  try{
    var json=await decryptBlob(BLOB,pw);
    DATA=JSON.parse(json);
    sessionStorage.setItem('siteData',json);
    showSite();
  }catch(e){
    err.textContent='コードが違います。もう一度お試しください。';
    document.getElementById('pw-input').value='';
    btn.textContent='ログイン';
    btn.disabled=false;
  }
}

async function decryptBlob(b64,pw){
  var buf=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0);});
  var salt=buf.slice(0,16);
  var iv=buf.slice(16,28);
  var data=buf.slice(28);
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']
  );
  var dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
  return new TextDecoder().decode(dec);
}

function showSite(){
  document.getElementById('lock-screen').style.display='none';
  document.getElementById('site-body').style.display='block';
  renderTab('all');
}

(function(){
  var d=sessionStorage.getItem('siteData');
  if(d){try{DATA=JSON.parse(d);showSite();}catch(e){sessionStorage.removeItem('siteData');}}
})();

var CAT_COLOR={limited:'rgba(79,142,247,.15)',closed:'rgba(247,95,95,.15)',always:'rgba(62,207,142,.12)',trial:'rgba(247,147,79,.15)'};

function buildCard(c){
  var dets=DATA.details[c.id]||[];
  var comb=DATA.combos[c.id]||[];

  var periodHtml=c.period?'<div class="period-bar"><span class="label">期間</span><span class="value">'+c.period+'</span></div>':'';

  var hlHtml='';
  if(c.highlight){
    hlHtml='<div class="highlight">'+c.highlight+'<br>';
    if(c.price_old) hlHtml+='<span class="price-old">'+c.price_old+'</span> → ';
    if(c.price_new) hlHtml+='<span class="price-new">'+c.price_new+'</span>';
    hlHtml+='</div>';
  }

  var kjHtml='';
  if(c.kojihi){
    kjHtml='<div class="kojihi-grid">'
      +'<div class="kojihi-box"><div class="kj-label">工事費総額</div><div class="kj-title">'+c.kojihi.title+'</div><div class="kj-price">'+c.kojihi.total+'<span style="font-size:12px">円</span></div><div class="kj-sub">÷ 24ヶ月</div></div>'
      +'<div class="kojihi-box"><div class="kj-label">毎月の値引き</div><div class="kj-title">工事月から24ヶ月</div><div class="kj-price">'+c.kojihi.monthly+'<span style="font-size:12px">円/月</span></div><div class="kj-sub">継続利用で実質無料</div></div>'
      +'</div>';
  }

  var okList=dets.filter(function(d){return d.type==='ok';});
  var ngList=dets.filter(function(d){return d.type==='ng';});
  var noteList=dets.filter(function(d){return d.type==='note';});

  var tgtHtml='';
  if(okList.length||ngList.length){
    tgtHtml='<div class="info-section"><div class="info-section-title">対象者</div>';
    okList.forEach(function(d){tgtHtml+='<div class="info-row ok"><span class="dot">✓</span>'+d.text+'</div>';});
    ngList.forEach(function(d){tgtHtml+='<div class="info-row warning"><span class="dot">✗</span>'+d.text+'</div>';});
    tgtHtml+='</div>';
  }

  var noteHtml='';
  if(noteList.length){
    noteHtml='<div class="info-section"><div class="info-section-title">注意事項</div>';
    noteList.forEach(function(d){noteHtml+='<div class="info-row"><span class="dot">・</span>'+d.text+'</div>';});
    noteHtml+='</div>';
  }

  var comboHtml='';
  if(comb.length){
    comboHtml='<div class="combo-title">重畳適用</div><div class="combo-grid">';
    comb.forEach(function(cb){
      var label=DATA.targetLabels[cb.to]||cb.to;
      var badge=cb.r==='ok'?'<span class="combo-badge combo-ok">✅ 可</span>':cb.r==='ng'?'<span class="combo-badge combo-ng">❌ 不可</span>':'<span class="combo-badge combo-na">— 対象外</span>';
      comboHtml+='<div class="combo-row"><span class="combo-name">'+label+'</span>'+badge+'</div>';
    });
    comboHtml+='</div>';
  }

  var aipoHtml=c.aipo?'<a href="'+c.aipo+'" target="_blank" class="aipo-link"><span class="link-icon">🔗</span><span class="link-text">Aipo 社内告知を確認する</span><span class="link-arrow">→</span></a>':'';

  return '<div class="card" data-cat="'+c.category+'" id="card-'+c.id+'">'
    +'<div class="card-header" onclick="this.closest(\'.card\').classList.toggle(\'open\')">'
    +'<div class="card-icon" style="background:'+CAT_COLOR[c.category]+'">'+c.icon+'</div>'
    +'<div class="card-title-wrap">'
    +'<span class="card-category cat-'+c.category+'">'+c.status+'</span>'
    +'<div class="card-title">'+c.name+'</div>'
    +(c.subtitle?'<div class="card-subtitle">'+c.subtitle+'</div>':'')
    +'</div><div class="card-chevron">▾</div></div>'
    +periodHtml
    +'<div class="card-body">'+hlHtml+kjHtml+tgtHtml+noteHtml+comboHtml+aipoHtml+'</div>'
    +'</div>';
}

function buildMatrix(){
  var cols=['c1','c2','c3','c5','c6','c7'];
  var rows=['c1','c2','c3','c6','c7','c8','c9'];
  var html='<div class="section-label">重畳適用一覧表</div><p class="matrix-hint">← 横スクロールできます</p><div class="matrix-wrap"><table class="matrix"><thead><tr><th>キャンペーン</th>';
  cols.forEach(function(id){html+='<th>'+DATA.targetLabels[id].replace('（','<br>（')+'</th>';});
  html+='</tr></thead><tbody>';
  rows.forEach(function(rid){
    var c=DATA.campaigns.find(function(x){return x.id===rid;});
    html+='<tr><td>'+c.name.replace('（','<br>（')+'</td>';
    cols.forEach(function(cid){
      if(cid===rid){html+='<td class="m-na">—</td>';return;}
      var cb=(DATA.combos[rid]||[]).find(function(x){return x.to===cid;});
      var r=cb?cb.r:'na';
      html+='<td class="m-'+r+'">'+(r==='ok'?'✅':r==='ng'?'❌':'—')+'</td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  html+='<div style="margin-top:14px;font-size:11px;color:var(--text-muted);line-height:1.8">'
    +'<div>✅ = 重畳適用可　　❌ = 重畳適用不可　　— = 対象外</div>'
    +'<div style="margin-top:4px">※ お友だち紹介・新築リフォームは原則全キャンペーンと併用可</div>'
    +'<div>※ ネット工事費実質無料はネット関係キャンペーン全て併用可</div></div>';
  html+='<div class="section-label" style="margin-top:24px">Aipo リンク一覧</div><div class="aipo-list">';
  DATA.campaigns.filter(function(c){return c.aipo;}).forEach(function(c){
    html+='<a href="'+c.aipo+'" target="_blank" class="aipo-link"><span class="link-icon">'+c.icon+'</span><span class="link-text">'+c.name+'</span><span class="link-arrow">→</span></a>';
  });
  html+='</div>';
  return html;
}

function renderTab(tab){
  var main=document.getElementById('main');
  if(tab==='matrix'){main.innerHTML=buildMatrix();return;}
  var sections=[
    {key:'limited',label:'期間限定キャンペーン'},
    {key:'closed',label:'期間限定キャンペーン（クローズド）'},
    {key:'always',label:'常設キャンペーン'},
    {key:'trial',label:'試験施策'},
  ];
  var html='';
  sections.forEach(function(s){
    var cards=DATA.campaigns.filter(function(c){return c.category===s.key&&(tab==='all'||c.category===tab);});
    if(cards.length) html+='<div class="section-label">'+s.label+'</div>'+cards.map(buildCard).join('');
  });
  main.innerHTML=html;
}

function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderTab(name);
}
